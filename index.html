<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binder</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="table-surface">
    <div class="binder" id="binder">

      <div class="binder-spine">
        <span class="spine-label" id="binderTitle">KANTO &middot; GEN 1</span>
        <button class="edit-toggle" id="editToggle">Edit</button>
      </div>

      <div class="binder-page">
        <div class="ring-holes">
          <span class="ring"></span>
          <span class="ring"></span>
          <span class="ring"></span>
        </div>
        <div class="pocket-grid" id="pocketGrid"></div>
      </div>

      <div class="binder-nav">
        <button class="nav-btn" id="prevPage" aria-label="Previous page">&larr;</button>
        <span class="page-indicator" id="pageIndicator">PAGE 1 OF 1</span>
        <button class="nav-btn" id="nextPage" aria-label="Next page">&rarr;</button>
        <button class="add-page-btn" id="addPageBtn" style="display:none;">+ Page</button>
      </div>

    </div>
  </div>

  <div class="card-detail" id="cardDetail">
    <div class="card-detail-inner">
      <button class="card-detail-close" id="closeDetail" aria-label="Close">&times;</button>
      <img id="detailImg" alt="">
      <div class="card-detail-meta">
        <h2 id="detailName"></h2>
        <p id="detailSet"></p>
      </div>
    </div>
  </div>

  <div class="slot-editor" id="slotEditor">
    <div class="slot-editor-inner">
      <button class="card-detail-close" id="closeSlotEditor" aria-label="Close">&times;</button>
      <h2 class="slot-editor-title">Edit slot</h2>

      <div class="editor-current" id="editorCurrent"></div>

      <input type="text" id="filterName" class="search-input" placeholder="Card name…">

      <div class="filter-grid">
        <select id="filterSet" class="filter-select"><option value="">Any set</option></select>
        <input type="text" id="filterNumber" class="filter-input" placeholder="Card #">
        <select id="filterType" class="filter-select"><option value="">Any type</option></select>
        <select id="filterRarity" class="filter-select"><option value="">Any rarity</option></select>
      </div>

      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
